name: Python Package (pip)

on:
  push:
  pull_request:

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (basic)
        run: |
          pip install flake8
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=12 --max-line-length=127 --statistics

      - name: Import check (app)
        env:
          # evita crash se app.py richiede env per init (facoltativo)
          SECRET_KEY: "ci_dummy_secret_key"
          ADMIN_PASSWORD: "ci_dummy_password"
          DB_PATH: "ci_test.db"
        run: |
          python -c "import app; print('OK: app importato')"
