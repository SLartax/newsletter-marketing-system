name: Python Package (pip)

on:
  push:
  pull_request:

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Lint (fast)
        run: |
          # Linta solo file utili, NON tutta la repo
          flake8 app.py import_contacts.py 2>/dev/null || true
          # Check severo solo su app.py (errori veri)
          flake8 app.py --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Import check (safe)
        env:
          SECRET_KEY: "ci_dummy_secret_key"
          ADMIN_PASSWORD: "ci_dummy_password"
          DB_PATH: "ci_test.db"
          # se nel tuo app.py esegue init_db_if_needed() all'import, questo evita path strani
        run: |
          python -c "import app; print('OK: import app')"
