<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuova Campagna - Newsletter System</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f5f5f5; }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .header-content { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
        .nav { display: flex; gap: 20px; }
        .nav a { color: white; text-decoration: none; padding: 8px 15px; border-radius: 5px; transition: background 0.3s; }
        .nav a:hover { background: rgba(255,255,255,0.2); }
        .container { max-width: 800px; margin: 0 auto; padding: 20px; }
        h1 { color: #333; margin-bottom: 20px; }
        .form-box { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; color: #333; }
        input[type="text"], input[type="file"], textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 5px; font-family: inherit; }
        textarea { min-height: 200px; resize: vertical; }
        .btn { padding: 12px 24px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 5px; font-weight: 600; cursor: pointer; font-size: 16px; transition: transform 0.2s; }
        .btn:hover { transform: translateY(-2px); }
        .logout { background: rgba(255,255,255,0.2); padding: 8px 15px; border-radius: 5px; color: white; text-decoration: none; }
        .help-text { font-size: 14px; color: #666; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-content">
            <h2>📧 Newsletter System</h2>
            <div class="nav">
                <a href="/">Dashboard</a>
                <a href="/campaigns">Campagne</a>
                <a href="/subscribers">Iscritti</a>
                <a href="/logout" class="logout">Logout</a>
            </div>
        </div>
    </div>
    <div class="container">
        <h1>Crea Nuova Campagna Email</h1>
        <div class="form-box">
            <form method="POST" enctype="multipart/form-data">
                <div class="form-group">
                    <label for="csv_file">📄 Carica CSV Contatti</label>
                    <input type="file" id="csv_file" name="csv_file" accept=".csv" required>
                    <p class="help-text">Carica un file CSV con le colonne: email, nome, cognome</p>
                </div>
                <div class="form-group">
                    <label for="subject">✉️ Oggetto Email</label>
                    <input type="text" id="subject" name="subject" placeholder="Inserisci l'oggetto della email" required>
                </div>
                <div class="form-group">
                    <label for="body">📝 Corpo Email</label>
                    <textarea id="body" name="body" placeholder="Scrivi il contenuto della tua email..." required></textarea>
                    <p class="help-text">Usa {{nome}} e {{cognome}} per personalizzare il messaggio</p>
                </div>
                <button type="submit" class="btn">🚀 Invia Campagna</button>
            </form>
        </div>
    </div>
</body>
</html>
