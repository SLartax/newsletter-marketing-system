<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Iscritti - Newsletter System</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f5f5f5; }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 20px; }
        .header-content { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
        .nav { display: flex; gap: 20px; }
        .nav a { color: white; text-decoration: none; padding: 8px 15px; border-radius: 5px; }
        .nav a:hover, .nav a.active { background: rgba(255,255,255,0.2); }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        h1 { margin-bottom: 20px; }
        table { width: 100%; background: white; border-radius: 10px; overflow: hidden; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #eee; }
        th { background: #667eea; color: white; }
        .status { padding: 5px 10px; border-radius: 5px; font-size: 12px; }
        .active { background: #d4edda; color: #155724; }
        .unsubscribed { background: #f8d7da; color: #721c24; }
        .logout { background: rgba(255,255,255,0.2); padding: 8px 15px; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-content">
            <h2>📧 Newsletter System</h2>
            <div class="nav">
                <a href="/">Dashboard</a>
                <a href="/campaigns">Campagne</a>
                <a href="/subscribers" class="active">Iscritti</a>
                <a href="/logout" class="logout">Logout</a>
            </div>
        </div>
    </div>
    <div class="container">
        <h1>Lista Iscritti</h1>
        <table>
            <thead>
                <tr>
                    <th>Email</th>
                    <th>Nome</th>
                    <th>Cognome</th>
                    <th>Stato</th>
                    <th>Data Iscrizione</th>
                </tr>
            </thead>
            <tbody>
                {% for sub in subscribers %}
                <tr>
                    <td>{{ sub.email }}</td>
                    <td>{{ sub.nome }}</td>
                    <td>{{ sub.cognome }}</td>
                    <td><span class="status {{ 'active' if sub.unsubscribed == 0 else 'unsubscribed' }}">
                        {{ 'Attivo' if sub.unsubscribed == 0 else 'Disiscritto' }}</span></td>
                    <td>{{ sub.created_at }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
